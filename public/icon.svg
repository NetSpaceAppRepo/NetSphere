<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Globe circle -->
  <circle cx="16" cy="16" r="12" fill="#03060f" stroke="#22d3ee" stroke-width="1.5"/>
  <!-- Meridians (longitude lines) -->
  <ellipse cx="16" cy="16" rx="5" ry="12" fill="none" stroke="#22d3ee" stroke-width="0.75" opacity="0.5"/>
  <ellipse cx="16" cy="16" rx="10" ry="12" fill="none" stroke="#22d3ee" stroke-width="0.75" opacity="0.3"/>
  <!-- Equator (latitude line) -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#22d3ee" stroke-width="0.75" opacity="0.4"/>
  <!-- Signal arc (packet path) -->
  <path d="M 8 22 Q 16 6 24 10" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Origin dot -->
  <circle cx="8" cy="22" r="1.5" fill="#22d3ee"/>
  <!-- Destination dot -->
  <circle cx="24" cy="10" r="1.5" fill="#f59e0b"/>
</svg>
